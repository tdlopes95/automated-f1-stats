name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          req=$(find . -name requirements.txt | head -n1)
          echo "Installing from ${req:-requirements.txt}"
          pip install -r "${req:-requirements.txt}"
          pip install ruff pytest

      - name: Lint with ruff (non-blocking)
        continue-on-error: true
        run: ruff check --output-format=github .

      - name: Syntax check
        run: python -m compileall -q .

      - name: Run tests (if present)
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            pytest -q
          else
            echo "No tests yet — add them under tests/ to turn this green with real coverage."
          fi
